    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#005CCF" letter-spacing="0.5">GLOBAL ALLIANCE</text>
    <rect x="0" y="34" width="20" height="2" fill="#01B1FC"/>
    <text x="26" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#475569" letter-spacing="0.8">INDUSTRY 4.0 ACCREDITED</text>
  </g>
